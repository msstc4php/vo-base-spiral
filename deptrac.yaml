deptrac:
  paths:
    - ./src
  layers:
    # The core and Spiral are not declared as layers, so every area may use them. The bootloader wires the filter
    # caster and the checker; the interceptor is registered by the application, so nothing here depends on it.
    - name: Bootloader
      collectors:
        - type: directory
          value: src/Bootloader/.*
    - name: Filter
      collectors:
        - type: directory
          value: src/Filter/.*
    - name: Interceptor
      collectors:
        - type: directory
          value: src/Interceptor/.*
    - name: Validation
      collectors:
        - type: directory
          value: src/Validation/.*
    - name: Internal
      collectors:
        - type: directory
          value: src/Internal/.*
  ruleset:
    Bootloader:
      - Filter
      - Validation
    Filter:
      - Internal
    Interceptor:
      - Internal
    Validation:
      - Internal
    Internal: ~
